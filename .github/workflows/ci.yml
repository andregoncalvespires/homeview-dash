name: CI

on:
  push:
    branches: [main]
  pull_request:

# "contents: write" is only used to commit go.mod/go.sum once (see last step).
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Go version
        run: go version

      - name: Resolve dependencies
        run: |
          if [ -f go.sum ]; then echo "HAD_SUM=true" >> "$GITHUB_ENV"; fi
          go mod tidy

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Needs gofmt:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Test (includes the real SQLite store)
        run: |
          set +e
          go test -race -count=1 ./... 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the output as a workflow annotation so failures are readable
            # without downloading the full logs.
            msg="$(head -c 6000 test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=go test failed::${msg}"
          fi
          exit "$status"

      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/homeview

      # First run only: commit the go.mod/go.sum that "go mod tidy" produced,
      # so builds are reproducible from then on.
      - name: Commit go.mod and go.sum
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAD_SUM != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "chore: add go.sum (go mod tidy)"
            git push
          fi

  # Builds the container image (without publishing) so Dockerfile problems show
  # up here instead of at release time.
  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: homeview:ci
          build-args: VERSION=ci
      - name: Smoke test the image
        run: |
          docker run --rm homeview:ci version
          docker run --rm homeview:ci help | head -3
          # The server must refuse to start without SMTP settings.
          if docker run --rm homeview:ci; then echo "expected failure without SMTP"; exit 1; fi
          # Start it for real, check health, then create an admin through the CLI.
          docker run -d --name hv -e HOMEVIEW_SMTP_HOST=localhost -e HOMEVIEW_SMTP_FROM=hv@example.com -p 8080:8080 homeview:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/login | grep -q "Entrar"
          docker exec hv homeview healthcheck
          docker exec hv homeview admin create --email ci@example.com --name CI
          docker exec hv homeview admin list | grep -q ci@example.com
          docker logs hv 2>&1 | tail -5
          docker rm -f hv
