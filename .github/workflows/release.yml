name: Release

# Publishes a new version whenever the VERSION file changes on main:
#   1. creates the tag v<VERSION> and the GitHub Release (notes from commits);
#   2. builds and pushes the container image (amd64 + arm64) to ghcr.io.
#
# Both steps live in this one workflow on purpose: tags/releases created with the
# default GITHUB_TOKEN do not trigger other workflows, so a separate
# "on: push: tags" image workflow would never run.
#
# Requires: Settings -> Actions -> General -> Workflow permissions ->
# "Read and write permissions".
on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file not found. Create it with the version number, e.g. 0.1.0"
            exit 1
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::VERSION must look like 1.2.3 or 1.2.3-rc.1, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create the release if it does not exist yet
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            flags=""
            case "$VERSION" in *-*) flags="--prerelease" ;; esac
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes $flags
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: release
    # Build after a new release; also on manual runs (to re-publish the image of
    # the current VERSION if an earlier image build failed).
    if: needs.release.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Image tags
        id: tags
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="${img}:${VERSION}"
          # Stable versions also move the "major.minor" and "latest" tags.
          case "$VERSION" in
            *-*) ;;
            *) tags="${tags},${img}:${VERSION%.*},${img}:latest" ;;
          esac
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
          build-args: VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
