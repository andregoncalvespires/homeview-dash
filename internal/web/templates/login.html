{{define "content"}}
<section class="panel narrow">
  <h1>{{t .Lang "login.title"}}</h1>
  <p class="muted">{{t .Lang "login.intro"}}</p>
  <form method="post" action="/login" class="form">
    <label>{{t .Lang "login.email"}}
      <input type="email" name="email" value="{{.Data.Email}}" required autofocus autocomplete="email" maxlength="254">
    </label>
    <button class="btn primary" type="submit">{{t .Lang "login.send"}}</button>
  </form>
</section>
{{end}}
